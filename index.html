<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japón 🇯🇵">
<title>Japón 2026 🇯🇵</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C0392B;--red-light:#E8A09A;--cream:#FAF7F2;--ink:#1A1410;
  --ink-mid:#3D3530;--ink-light:#8C7B72;--sand:#EDE8E0;--sand-dark:#D4CFC5;
  --white:#FFFFFF;--green:#2E7D56;--gold:#B8860B;--blue:#1A5276;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden;}

/* LOCK */
#lock-screen{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:40px 32px;}
#lock-screen.hidden{display:none;}
.lock-torii{font-size:64px;margin-bottom:24px;}
.lock-title{font-family:'Noto Serif JP',serif;font-size:26px;color:var(--cream);margin-bottom:6px;}
.lock-sub{font-size:13px;color:var(--ink-light);margin-bottom:36px;}
.lock-input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:16px 20px;font-family:'DM Sans',sans-serif;font-size:18px;color:var(--cream);text-align:center;letter-spacing:0.15em;outline:none;margin-bottom:14px;}
.lock-input:focus{border-color:var(--red-light);}
.lock-btn{width:100%;background:var(--red);color:white;border:none;border-radius:12px;padding:16px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;}
.lock-error{font-size:13px;color:var(--red-light);margin-top:12px;min-height:18px;}

/* SCREENS */
.screen{display:none;min-height:100vh;padding-bottom:calc(70px + var(--safe-bottom));}
.screen.active{display:block;}

/* TOPBAR */
.topbar{background:var(--ink);color:var(--cream);padding:calc(var(--safe-top) + 14px) 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-title{font-family:'Noto Serif JP',serif;font-size:17px;font-weight:700;}
.topbar-sub{font-size:11px;color:var(--ink-light);font-weight:300;margin-top:1px;}
.back-btn{background:none;border:none;color:var(--cream);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;padding:4px 0;}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--ink);display:flex;padding-bottom:var(--safe-bottom);z-index:200;border-top:1px solid rgba(255,255,255,0.08);}
.nav-btn{flex:1;background:none;border:none;color:rgba(255,255,255,0.4);padding:10px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.2s;font-family:'DM Sans',sans-serif;}
.nav-btn.active{color:var(--red-light);}
.nav-btn svg{width:20px;height:20px;}
.nav-btn span{font-size:9px;font-weight:500;}

/* HOME HERO */
.home-hero{background:var(--ink);color:var(--cream);padding:24px 20px 0;position:relative;overflow:hidden;}
.home-hero::before{content:'⛩';position:absolute;font-size:120px;opacity:0.04;top:-10px;right:-10px;pointer-events:none;}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.hero-left .countdown-num{font-family:'Noto Serif JP',serif;font-size:64px;font-weight:700;color:var(--red-light);line-height:1;}
.hero-left .countdown-label{font-size:11px;color:var(--ink-light);letter-spacing:0.1em;text-transform:uppercase;margin-top:4px;}
.hero-right{text-align:right;padding-top:8px;}
.hero-right .today-date{font-size:13px;color:var(--sand);font-weight:300;}
.hero-right .trip-dates{font-size:11px;color:var(--ink-light);margin-top:4px;}

/* TIMELINE */
.timeline-section{background:var(--ink);padding:0 0 16px;}
.timeline-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 20px;}
.timeline-wrapper::-webkit-scrollbar{display:none;}
.timeline-track{display:flex;align-items:flex-start;gap:0;width:max-content;}
.tl-item{display:flex;flex-direction:column;align-items:center;width:72px;cursor:pointer;position:relative;}
.tl-item:not(:last-child)::after{content:'';position:absolute;top:10px;left:calc(50% + 8px);width:56px;height:1px;background:rgba(255,255,255,0.12);}
.tl-item.tl-visited::after{background:rgba(46,125,86,0.4);}
.tl-item.tl-current::after{background:rgba(192,57,43,0.4);}
.tl-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;margin-bottom:7px;border:2px solid transparent;}
.tl-item.tl-visited .tl-dot{background:rgba(46,125,86,0.5);border-color:rgba(46,125,86,0.3);}
.tl-item.tl-current .tl-dot{background:var(--red);border-color:var(--red-light);box-shadow:0 0 10px rgba(192,57,43,0.6);animation:pulse-tl 1.5s infinite;}
.tl-item.tl-pending .tl-dot{background:#2A2420;border-color:#3D3530;}
@keyframes pulse-tl{0%,100%{box-shadow:0 0 8px rgba(192,57,43,0.6);}50%{box-shadow:0 0 16px rgba(192,57,43,0.9);}}
.tl-city{font-size:8px;color:rgba(255,255,255,0.35);text-align:center;line-height:1.3;max-width:66px;}
.tl-item.tl-visited .tl-city{color:rgba(46,125,86,0.7);}
.tl-item.tl-current .tl-city{color:var(--red-light);font-weight:600;}
.tl-date{font-size:7px;color:rgba(255,255,255,0.18);margin-top:2px;text-align:center;}
.tl-item.tl-current .tl-date{color:rgba(232,160,154,0.6);}
.timeline-footer{display:flex;justify-content:flex-end;padding:0 20px 4px;}
.back-today-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.5);border-radius:20px;padding:4px 12px;font-size:10px;font-family:'DM Sans',sans-serif;cursor:pointer;display:none;}
.back-today-btn.visible{display:block;}

/* HOME BODY */
.home-body{padding:14px 16px;}
.section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-light);margin-bottom:8px;}

/* PENDING SECTION */
.pending-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.pending-header-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-light);}
.pending-header-btns{display:flex;gap:8px;align-items:center;}
.pending-add-btn{background:var(--red);color:white;border:none;border-radius:50%;width:24px;height:24px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-weight:300;}
.pending-done-btn{background:rgba(46,125,86,0.12);color:var(--green);border:1px solid rgba(46,125,86,0.2);border-radius:20px;padding:3px 10px;font-size:10px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.pending-card{background:var(--white);border-radius:14px;border:1px solid var(--sand-dark);overflow:hidden;margin-bottom:12px;}
.pending-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--sand);}
.pending-item:last-child{border-bottom:none;}
.pending-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--sand-dark);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all 0.2s;background:transparent;}
.pending-check.done{background:var(--green);border-color:var(--green);}
.pending-check.done::after{content:'✓';color:white;font-size:12px;font-weight:700;}
.pending-info{flex:1;min-width:0;}
.pending-title{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3;}
.pending-title.done-text{text-decoration:line-through;color:var(--ink-light);}
.pending-sub{font-size:11px;color:var(--ink-light);margin-top:3px;line-height:1.5;}
.pending-day-tag{font-size:10px;color:var(--red);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}
.pending-note-inp{width:100%;border:1px solid var(--sand-dark);outline:none;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink-mid);background:var(--cream);border-radius:6px;padding:6px 8px;margin-top:6px;resize:none;}
.empty-pending{text-align:center;padding:20px;color:var(--ink-light);font-size:13px;background:var(--white);border-radius:14px;border:1px solid var(--sand-dark);margin-bottom:12px;}

/* QUICK FLIGHT */
/* DAY SUMMARY CARD */
.day-summary-card{background:var(--ink);border-radius:14px;padding:16px;color:var(--cream);margin-bottom:12px;cursor:pointer;}
.day-summary-card:active{opacity:0.9;}
.ds-card-label{font-size:10px;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;}
.ds-card-city{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:700;color:var(--cream);margin-bottom:12px;line-height:1.2;}
.ds-card-rows{display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;}
.ds-card-row{display:flex;align-items:center;gap:10px;}
.ds-card-icon{font-size:14px;flex-shrink:0;width:20px;text-align:center;}
.ds-card-text{font-size:12px;color:var(--sand);line-height:1.4;}
.ds-card-text span{color:var(--red-light);font-weight:600;}

/* ITINERARY */
.itinerary-list{padding:10px 14px;}
.day-card{border-radius:14px;margin-bottom:8px;overflow:hidden;cursor:pointer;transition:transform 0.15s;border:1px solid var(--sand-dark);}
.day-card:active{transform:scale(0.98);}
.day-card.past{background:rgba(46,125,86,0.06);border-color:rgba(46,125,86,0.2);opacity:0.85;}
.day-card.today{background:var(--white);border-color:var(--red);box-shadow:0 0 0 1px rgba(192,57,43,0.15);}
.day-card.future{background:var(--white);}
.day-card-header{display:flex;align-items:center;padding:12px 13px;gap:11px;}
.day-badge{border-radius:10px;width:40px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.badge-past{background:rgba(46,125,86,0.15);}
.badge-today{background:var(--red);}
.badge-future{background:var(--ink);}
.day-num{font-size:16px;font-weight:700;line-height:1;}
.num-past{color:var(--green);}
.num-today{color:white;}
.num-future{color:var(--cream);}
.day-mon{font-size:8px;text-transform:uppercase;letter-spacing:0.08em;}
.mon-past{color:rgba(46,125,86,0.6);}
.mon-today{color:rgba(255,255,255,0.7);}
.mon-future{color:var(--ink-light);}
.day-info{flex:1;min-width:0;}
.day-city{font-size:14px;font-weight:600;}
.city-past{color:rgba(46,125,86,0.8);}
.city-today{color:var(--red);}
.city-future{color:var(--ink);}
.day-label{font-size:11px;color:var(--ink-light);margin-top:2px;}
.day-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.tag{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:500;}
.tag-train{background:#D6E8F5;color:#1A5276;}
.tag-bus{background:#EBD9F8;color:#6C3483;}
.tag-fly{background:#D9F0E8;color:#1A6B45;}
.tag-ferry{background:#FDE8CC;color:#935116;}
.tag-free{background:#EEF0F3;color:#5D6D7E;}
.tag-check{background:#FDECEA;color:#C0392B;}
.day-arrow{color:var(--sand-dark);font-size:14px;}

/* DETAIL */
#detail-screen{background:var(--cream);}
.detail-topbar{background:var(--ink);color:var(--cream);padding:calc(var(--safe-top) + 12px) 16px 14px;position:sticky;top:0;z-index:100;}
.detail-city{font-size:19px;font-weight:700;font-family:'Noto Serif JP',serif;}
.detail-date{font-size:11px;color:var(--ink-light);margin-top:3px;}
.detail-content{padding:14px;}
.detail-section{margin-bottom:18px;}
.ds-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-light);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.ds-title::after{content:'';flex:1;height:1px;background:var(--sand-dark);}
.transport-card{background:var(--white);border-radius:12px;padding:12px;border:1px solid var(--sand-dark);margin-bottom:6px;}
.transport-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.transport-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.ti-train{background:#D6E8F5;}.ti-bus{background:#EBD9F8;}.ti-fly{background:#D9F0E8;}.ti-ferry{background:#FDE8CC;}
.transport-route{font-size:13px;font-weight:600;}
.transport-time{font-size:11px;color:var(--ink-light);margin-top:1px;}
.transport-detail{font-size:12px;color:var(--ink-mid);line-height:1.6;background:var(--cream);border-radius:8px;padding:9px 11px;margin-top:4px;border-left:3px solid var(--sand-dark);}
.td-booked{border-left-color:var(--green);}
.td-todo{border-left-color:var(--gold);}
.hotel-card{background:var(--white);border-radius:12px;padding:12px;border:1px solid var(--sand-dark);display:flex;align-items:center;gap:11px;}
.hotel-name{font-size:13px;font-weight:600;}
.hotel-price{font-size:11px;color:var(--ink-light);margin-top:2px;}
.hotel-paid{font-size:11px;color:var(--green);font-weight:500;margin-top:1px;}
.task-card{background:var(--white);border-radius:12px;padding:12px;border:1px solid var(--sand-dark);}
.task-item{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--sand);font-size:12px;line-height:1.5;color:var(--ink-mid);}
.task-item:last-child{border-bottom:none;padding-bottom:0;}
.task-item:first-child{padding-top:0;}
.task-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.td-green{background:var(--green);}.td-gold{background:var(--gold);}
.activity-card{background:var(--ink);color:var(--cream);border-radius:12px;padding:13px;}
.activity-text{font-size:13px;line-height:1.6;}
.activity-edit-btn{background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:14px;padding:2px 4px;flex-shrink:0;line-height:1;}
.activity-edit-btn:hover{color:var(--red-light);}
.activity-textarea{width:100%;background:transparent;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--cream);line-height:1.6;resize:none;min-height:80px;}
.activity-edit-actions{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.1);}
.activity-save-btn{background:var(--red);color:white;border:none;border-radius:8px;padding:6px 14px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}
.activity-cancel-btn{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);border:none;border-radius:8px;padding:6px 14px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;}

/* DAY PENDING */
.day-pending-card{background:var(--white);border-radius:12px;padding:12px;border:1px solid var(--sand-dark);}
.dp-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--sand);font-size:12px;color:var(--ink-mid);line-height:1.5;}
.dp-item:last-child{border-bottom:none;padding-bottom:0;}
.dp-item:first-child{padding-top:0;}
.dp-item.dp-done{opacity:0.5;}
.dp-check{width:20px;height:20px;border-radius:5px;border:2px solid var(--sand-dark);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all 0.2s;}
.dp-check.dp-checked{background:var(--green);border-color:var(--green);}
.dp-check.dp-checked::after{content:'✓';color:white;font-size:10px;font-weight:700;}
.dp-info{flex:1;}
.dp-title{font-weight:600;font-size:12px;}
.dp-desc{font-size:11px;color:var(--ink-light);margin-top:2px;}

/* DAY NOTES */
.day-notes-card{background:#F0F7F4;border-radius:12px;padding:12px;border:1px solid rgba(46,125,86,0.2);}
.day-note-item{padding:8px 0;border-bottom:1px solid rgba(46,125,86,0.15);font-size:12px;color:var(--ink-mid);line-height:1.5;}
.day-note-item:last-child{border-bottom:none;padding-bottom:0;}
.day-note-item:first-child{padding-top:0;}
.day-note-meta{font-size:10px;color:var(--green);font-weight:600;margin-bottom:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.day-note-tag{font-size:9px;background:rgba(46,125,86,0.12);color:var(--green);padding:1px 6px;border-radius:10px;}

/* DOCS */
.docs-body{padding:14px;}
.doc-group{margin-bottom:16px;}
.doc-card{background:var(--white);border-radius:12px;border:1px solid var(--sand-dark);overflow:hidden;margin-bottom:6px;}
.doc-header{padding:12px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.doc-icon{font-size:20px;}
.doc-title{font-size:13px;font-weight:600;flex:1;}
.doc-subtitle{font-size:11px;color:var(--ink-light);margin-top:1px;}
.doc-chevron{color:var(--ink-light);font-size:14px;transition:transform 0.2s;}
.doc-card.open .doc-chevron{transform:rotate(180deg);}
.doc-body{display:none;padding:0 13px 13px;border-top:1px solid var(--sand);}
.doc-card.open .doc-body{display:block;}
.doc-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--sand);gap:10px;}
.doc-row:last-child{border-bottom:none;}
.doc-key{font-size:11px;color:var(--ink-light);flex-shrink:0;min-width:90px;}
.doc-val{font-size:12px;font-weight:500;text-align:right;color:var(--ink);word-break:break-all;}

/* NOTES */
.notes-body{padding:14px;}
.note-input-area{background:var(--white);border-radius:14px;padding:13px;border:1px solid var(--sand-dark);margin-bottom:14px;}
.note-input-area textarea{width:100%;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:transparent;resize:none;min-height:75px;line-height:1.6;}
.note-input-area textarea::placeholder{color:var(--ink-light);}
.tags-row{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--sand);flex-wrap:wrap;}
.tag-pill{font-size:11px;padding:3px 8px;border-radius:20px;background:#D6E8F5;color:var(--blue);font-weight:500;display:flex;align-items:center;gap:4px;}
.tag-pill button{background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px;padding:0;line-height:1;}
.tag-input-field{border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--blue);background:transparent;min-width:70px;flex:1;}
.tag-input-field::placeholder{color:var(--ink-light);}
.note-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--sand);}
.note-day-select{font-family:'DM Sans',sans-serif;font-size:12px;border:1px solid var(--sand-dark);border-radius:8px;padding:5px 8px;background:var(--cream);color:var(--ink);outline:none;max-width:180px;}
.save-btn{background:var(--red);color:white;border:none;border-radius:8px;padding:7px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.note-card{background:var(--white);border-radius:12px;padding:12px;border:1px solid var(--sand-dark);margin-bottom:8px;}
.note-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.note-day-label{font-size:10px;font-weight:600;color:var(--red);text-transform:uppercase;letter-spacing:0.08em;}
.note-date-label{font-size:10px;color:var(--ink-light);}
.note-text{font-size:13px;color:var(--ink-mid);line-height:1.6;margin-bottom:6px;}
.note-tags-display{display:flex;flex-wrap:wrap;gap:4px;}
.note-tag-chip{font-size:10px;padding:2px 7px;border-radius:20px;background:#D6E8F5;color:var(--blue);font-weight:500;}
.note-delete{background:none;border:none;color:var(--ink-light);cursor:pointer;font-size:18px;padding:2px;flex-shrink:0;}
.empty-notes{text-align:center;padding:40px 20px;color:var(--ink-light);}
.empty-notes .emoji{font-size:48px;margin-bottom:12px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);}

/* PHRASES */
.phrases-body{padding:14px;}
.phrase-group{margin-bottom:16px;}
.phrase-list{display:flex;flex-direction:column;gap:7px;}
.phrase-card{background:var(--white);border-radius:12px;padding:12px 14px;border:1px solid var(--sand-dark);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:transform 0.15s;}
.phrase-card:active{transform:scale(0.98);}
.phrase-card.interactive{border-left:3px solid var(--blue);}
.phrase-es{font-size:13px;font-weight:500;color:var(--ink);}
.phrase-preview{font-size:11px;color:var(--ink-light);margin-top:2px;}
.phrase-arrow{color:var(--sand-dark);font-size:14px;flex-shrink:0;}
.add-phrase-btn{width:100%;background:var(--ink);color:var(--cream);border:none;border-radius:12px;padding:13px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;}

/* PHRASE MODAL */
.phrase-modal{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;}
.phrase-modal.hidden{display:none;}
.phrase-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);}
.phrase-content{position:relative;margin-top:auto;background:var(--ink);border-radius:24px 24px 0 0;padding:24px 24px calc(24px + var(--safe-bottom));min-height:55vh;display:flex;flex-direction:column;}
.phrase-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.1);border:none;color:var(--cream);font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.phrase-modal-label{font-size:12px;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;}
.phrase-jp-big{font-family:'Noto Serif JP',serif;font-size:28px;color:var(--cream);line-height:1.4;margin-bottom:14px;flex:1;display:flex;align-items:center;}
.phrase-romaji{font-size:15px;color:var(--red-light);margin-bottom:8px;font-style:italic;}
.phrase-es-small{font-size:13px;color:var(--ink-light);}
.phrase-interactive-input{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--cream);width:100%;outline:none;margin-bottom:12px;}
.phrase-interactive-input::placeholder{color:rgba(255,255,255,0.3);}

/* ADD MODALS */
.add-modal{position:fixed;inset:0;z-index:600;display:flex;flex-direction:column;}
.add-modal.hidden{display:none;}
.add-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);}
.add-content{position:relative;margin-top:auto;background:var(--cream);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--safe-bottom));}
.add-content h3{font-size:16px;font-weight:700;margin-bottom:16px;}
.add-field{margin-bottom:12px;}
.add-field label{font-size:11px;font-weight:600;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:5px;}
.add-field input,.add-field select,.add-field textarea{width:100%;border:1px solid var(--sand-dark);border-radius:10px;padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--white);outline:none;}
.add-field input:focus,.add-field select:focus,.add-field textarea:focus{border-color:var(--red);}
.add-field textarea{resize:none;min-height:60px;}
.add-save-btn{width:100%;background:var(--red);color:white;border:none;border-radius:12px;padding:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
.add-cancel{width:100%;background:none;border:none;color:var(--ink-light);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;padding:12px;margin-top:4px;}

/* DONE TASKS MODAL */
.done-modal{position:fixed;inset:0;z-index:600;display:flex;flex-direction:column;}
.done-modal.hidden{display:none;}
.done-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);}
.done-content{position:relative;margin-top:auto;background:var(--cream);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--safe-bottom));max-height:70vh;overflow-y:auto;}
.done-content h3{font-size:16px;font-weight:700;margin-bottom:16px;}
.done-item{background:var(--white);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(46,125,86,0.2);opacity:0.8;}
.done-item-title{font-size:13px;font-weight:600;color:var(--green);text-decoration:line-through;}
.done-item-sub{font-size:11px;color:var(--ink-light);margin-top:2px;}
.done-item-day{font-size:10px;color:var(--green);font-weight:600;margin-top:4px;}
.done-close{width:100%;background:var(--ink);color:white;border:none;border-radius:12px;padding:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}

::-webkit-scrollbar{display:none;}
</style>

};

window._fbLoad = async function() {
  try {

};

  });
};

// ═══ TIMELINE ═══
function renderTimeline(){
  const track=document.getElementById('timeline-track');
  track.innerHTML=days.map((d,i)=>{
    const s=d.date<TODAY_STR?'tl-visited':d.date===TODAY_STR?'tl-current':'tl-pending';
    const city=d.city.split('→')[0].trim().split(' ')[0];
    return `<div class="tl-item ${s}" onclick="showDay(${i})">
      <div class="tl-dot"></div>
      <div class="tl-city">${city}</div>
      <div class="tl-date">${d.num} ${d.month}</div>
    </div>`;
  }).join('');
  setTimeout(()=>scrollToToday(true),100);
  const wrapper=document.getElementById('timeline-wrapper');
  wrapper.addEventListener('scroll',()=>{
    const todayIdx=days.findIndex(d=>d.date===TODAY_STR);
    if(todayIdx<0)return;
    const items=track.querySelectorAll('.tl-item');
    if(!items[todayIdx])return;
    const il=items[todayIdx].offsetLeft;
    const ws=wrapper.scrollLeft,ww=wrapper.clientWidth;
    document.getElementById('back-today-btn').classList.toggle('visible',!(il>=ws&&il<=(ws+ww-72)));
  });
}
function scrollToToday(instant){
  const wrapper=document.getElementById('timeline-wrapper');
  const track=document.getElementById('timeline-track');
  const idx=Math.max(0,days.findIndex(d=>d.date===TODAY_STR));
  const items=track.querySelectorAll('.tl-item');
  if(!items[idx])return;
  const center=items[idx].offsetLeft-(wrapper.clientWidth/2)+36;
  wrapper.scrollTo({left:Math.max(0,center),behavior:instant?'auto':'smooth'});
}
renderTimeline();

function loadTaskState(){try{return JSON.parse(localStorage.getItem(TASK_STATE_KEY)||'{}');}catch(e){return{};}}
function saveTaskState(s){fbSaveTaskState(s);}
function loadCustomTasks(){try{return JSON.parse(localStorage.getItem(TASKS_KEY)||'[]');}catch(e){return[];}}
function saveCustomTasks(t){fbSaveCustomTasks(t);}

function getAllTasks(){
  const custom=loadCustomTasks();
  return [...defaultTasks,...custom];
}

function isTaskDone(id){
  const state=loadTaskState();
  const task=defaultTasks.find(t=>t.id===id);
  if(task&&task.doneByDefault&&state[id]===undefined)return true;
  return !!state[id];
}

function toggleTask(id, andRefreshDay){
  if(readOnly){showReadOnlyMsg();return;}
  const state=loadTaskState();
  const task=defaultTasks.find(t=>t.id===id);
  // For doneByDefault tasks: if state is undefined they're done, so set to false (pending)
  if(task&&task.doneByDefault&&state[id]===undefined){state[id]=false;}
  else{state[id]=!state[id];}
  saveTaskState(state);
  renderHomePending();
  if(andRefreshDay!==undefined)showDay(andRefreshDay);
}

function renderHomePending(){
  const all=getAllTasks();
  const pending=all.filter(t=>!isTaskDone(t.id));
  const section=document.getElementById('home-pending');
  if(pending.length===0){
    section.innerHTML=`<div class="empty-pending">🎉 ¡Todo gestionado!</div>`;
  } else {
    let html=`<div class="pending-card">`;
    pending.forEach(t=>{
      html+=`<div class="pending-item">
        <div class="pending-check" onclick="toggleTask('${t.id}')"></div>
        <div class="pending-info">
          <div class="pending-title">${t.title}</div>
          ${t.desc?`<div class="pending-sub">${t.desc}</div>`:''}
          <div class="pending-day-tag">${t.dayLabel||'Antes del viaje'}</div>
        </div>
      </div>`;
    });
    html+=`</div>`;
    section.innerHTML=html;
  }
  renderDaySummary();
}
renderHomePending();

function openDoneModal(){
  const all=getAllTasks();
  const done=all.filter(t=>isTaskDone(t.id));
  const list=document.getElementById('done-list');
  if(done.length===0){
    list.innerHTML=`<div style="text-align:center;color:var(--ink-light);padding:20px;font-size:14px;">Todavía no hay tareas finalizadas</div>`;
  } else {
    list.innerHTML=done.map(t=>`
      <div class="done-item" style="display:flex;align-items:flex-start;gap:12px;">
        <div class="pending-check done" onclick="toggleTask('${t.id}');openDoneModal();" style="flex-shrink:0;margin-top:2px;cursor:pointer;" title="Reactivar tarea"></div>
        <div style="flex:1;">
          <div class="done-item-title">${t.title}</div>
          ${t.desc?`<div class="done-item-sub">${t.desc}</div>`:''}
          <div class="done-item-day">${t.dayLabel||'Antes del viaje'}</div>
        </div>
      </div>`).join('');
  }
  document.getElementById('done-modal').classList.remove('hidden');
}
function closeDoneModal(){document.getElementById('done-modal').classList.add('hidden');}

function renderDaySummary(){
  const titleEl=document.getElementById('day-summary-title');
  const cardEl=document.getElementById('day-summary-card');
  const todayIdx=days.findIndex(d=>d.date===TODAY_STR);
  const preTrip=TODAY_STR<'2026-06-20';
  const postTrip=TODAY_STR>'2026-07-11';

  let dayToShow=null;
  let labelText='Hoy';

  if(preTrip){
    // Before trip: show flight info
    labelText='Vuelo de ida';
    const flightDay=days[0];
    let rows=`<div class="ds-card-row"><div class="ds-card-icon">✈</div><div class="ds-card-text"><span>BCN → PVG</span> · 12:10 · 20 jun · Air China CA840</div></div>`;
    rows+=`<div class="ds-card-row"><div class="ds-card-icon">✈</div><div class="ds-card-text"><span>PVG → KIX</span> · 11:50 · 21 jun · Air China CA857</div></div>`;
    rows+=`<div class="ds-card-row"><div class="ds-card-icon">📋</div><div class="ds-card-text">Ref: <span>QCS0M4</span></div></div>`;
    cardEl.innerHTML=`<div class="day-summary-card" onclick="showDay(0)">
      <div class="ds-card-label">${labelText}</div>
      <div class="ds-card-city">Barcelona → Japón</div>
      <div class="ds-card-rows">${rows}</div>
    </div>`;
    titleEl.textContent=labelText;
    return;
  }

  if(postTrip){
    cardEl.innerHTML=`<div class="day-summary-card"><div class="ds-card-label">Viaje</div><div class="ds-card-city">¡Buen viaje! 🎌</div></div>`;
    titleEl.textContent='Viaje finalizado';
    return;
  }

  if(todayIdx>=0){
    dayToShow=days[todayIdx];
    labelText=`Hoy · ${dayToShow.weekday} ${dayToShow.num} ${dayToShow.month}`;
  }

  if(!dayToShow){cardEl.innerHTML='';return;}

  const d=dayToShow;
  const dayIdx=todayIdx;
  let rows='';

  // Main transport
  if(d.transport.length>0){
    const t=d.transport[0];
    const icons={fly:'✈',train:'🚄',bus:'🚌',ferry:'⛴'};
    rows+=`<div class="ds-card-row"><div class="ds-card-icon">${icons[t.type]||'🚌'}</div><div class="ds-card-text"><span>${t.route}</span>${t.time?` · ${t.time}`:''}</div></div>`;
  }

  // Hotel
  if(d.hotel){
    rows+=`<div class="ds-card-row"><div class="ds-card-icon">🏨</div><div class="ds-card-text"><span>${d.hotel.name}</span> · ${d.hotel.price}</div></div>`;
  }

  // Pending tasks today
  const todayTasks=getAllTasks().filter(t=>t.day===d.date&&!isTaskDone(t.id));
  if(todayTasks.length>0){
    rows+=`<div class="ds-card-row"><div class="ds-card-icon">📋</div><div class="ds-card-text"><span>${todayTasks.length} tarea${todayTasks.length>1?'s':''} pendiente${todayTasks.length>1?'s':''}</div></div>`;
  }

  // Activity short
  if(d.activity){
    const customAct=loadActivity(dayIdx);
    const actText=customAct!==null?customAct:d.activity;
    const short=actText.split('\n')[0].substring(0,80)+(actText.length>80?'…':'');
    rows+=`<div class="ds-card-row"><div class="ds-card-icon">🗺</div><div class="ds-card-text">${short}</div></div>`;
  }

  cardEl.innerHTML=`<div class="day-summary-card" onclick="showDay(${dayIdx})">
    <div class="ds-card-label">${labelText}</div>

function showDay(i){
  const d=days[i];
  document.getElementById('detail-city').textContent=d.city;
  document.getElementById('detail-date').textContent=`${d.weekday}, ${d.num} ${d.month} 2026 · ${d.label}`;
  const icons={train:'🚄',bus:'🚌',fly:'✈',ferry:'⛴'};
  let html='';

  if(d.transport.length>0){
    html+=`<div class="detail-section"><div class="ds-title">Trayectos</div>`;
    d.transport.forEach(t=>{
      const bc=t.booked?'td-booked':'td-todo';
      html+=`<div class="transport-card">
        <div class="transport-header">
          <div class="transport-icon ti-${t.type}">${icons[t.type]||'🚶'}</div>
          <div><div class="transport-route">${t.route}</div><div class="transport-time">${t.time}</div></div>
        </div>
        ${t.detail?`<div class="transport-detail ${bc}">${t.detail.replace(/\n/g,'<br>')}</div>`:''}
      </div>`;
    });
    html+=`</div>`;
  }

  if(d.hotel){
    html+=`<div class="detail-section"><div class="ds-title">Alojamiento</div>
      <div class="hotel-card"><div style="font-size:22px">🏨</div>
        <div><div class="hotel-name">${d.hotel.name}</div><div class="hotel-price">${d.hotel.price}/noche</div>
        ${d.hotel.paid!=='?'?`<div class="hotel-paid">✓ Pagado por ${d.hotel.paid}</div>`:'<div class="hotel-price">Por confirmar</div>'}
        </div></div></div>`;
  }

  if(d.booked.length>0){
    html+=`<div class="detail-section"><div class="ds-title">✅ Ya gestionado</div><div class="task-card">`;
    d.booked.forEach(t=>html+=`<div class="task-item"><div class="task-dot td-green"></div><div>${t}</div></div>`);
    html+=`</div></div>`;
  }

  if(d.todo.length>0){
    html+=`<div class="detail-section"><div class="ds-title">🎫 Gestionar aquí</div><div class="task-card">`;
    d.todo.forEach(t=>html+=`<div class="task-item"><div class="task-dot td-gold"></div><div>${t.replace(/\n/g,'<br>')}</div></div>`);
    html+=`</div></div>`;
  }

  // Day tasks from task system
  const allTasks=getAllTasks();
  const dayTasks=allTasks.filter(t=>t.day===d.date);
  if(dayTasks.length>0){
    const pending=dayTasks.filter(t=>!isTaskDone(t.id));
    const done=dayTasks.filter(t=>isTaskDone(t.id));
    html+=`<div class="detail-section"><div class="ds-title">📋 Tareas del día</div><div class="day-pending-card">`;
    pending.forEach(t=>{
      html+=`<div class="dp-item">
        <div class="dp-check" onclick="toggleTask('${t.id}',${i})"></div>
        <div class="dp-info"><div class="dp-title">${t.title}</div>${t.desc?`<div class="dp-desc">${t.desc}</div>`:''}</div>
      </div>`;
    });
    done.forEach(t=>{
      html+=`<div class="dp-item dp-done">
        <div class="dp-check dp-checked"></div>
        <div class="dp-info"><div class="dp-title" style="text-decoration:line-through">${t.title}</div>${t.desc?`<div class="dp-desc">${t.desc}</div>`:''}</div>
      </div>`;
    });
    html+=`</div></div>`;
  }

  if(d.activity){
    const customAct=loadActivity(i);
    const actText=customAct!==null?customAct:d.activity;
    html+=`<div class="detail-section">
      <div class="ds-title">Actividad del día
        <button class="activity-edit-btn" onclick="startEditActivity(${i})" id="edit-btn-${i}" title="Editar">✏️</button>
      </div>
      <div class="activity-card" id="activity-card-${i}">
        <div class="activity-text" id="activity-text-${i}">${actText.replace(/\n/g,'<br>')}</div>
      </div>
    </div>`;
  }

  // Day notes
  const notes=loadNotes().filter(n=>n.date===d.date);
  if(notes.length>0){
    html+=`<div class="detail-section"><div class="ds-title">📝 Notas del día</div><div class="day-notes-card">`;
    notes.forEach(n=>{
      const tags=n.tags&&n.tags.length>0?n.tags.map(t=>`<span class="day-note-tag">#${t}</span>`).join(''):'';
      html+=`<div class="day-note-item"><div class="day-note-meta"><span>${n.savedAt}</span>${tags}</div><div>${n.text.replace(/\n/g,'<br>')}</div></div>`;
    });
    html+=`</div></div>`;
  }

  document.getElementById('detail-content').innerHTML=html;
  showScreen('detail');
}
function goBack(){showScreen('itinerary');}

// ═══ FIREBASE SYNC ═══
const NOTES_KEY='j26_notes';
const TASKS_KEY='j26_tasks';
const TASK_STATE_KEY='j26_task_state';
const ACT_KEY='j26_activities';
const PHRASES_KEY='j26_phrases';

// Local cache (fallback + speed)
let _cache = {};

async function fbInit() {
  const data = await window._fbLoad();
  _cache = data || {};
  // Seed localStorage from Firebase
  if(_cache.notes) try{localStorage.setItem(NOTES_KEY, JSON.stringify(_cache.notes));}catch(e){}
  if(_cache.taskState) try{localStorage.setItem(TASK_STATE_KEY, JSON.stringify(_cache.taskState));}catch(e){}
  if(_cache.customTasks) try{localStorage.setItem(TASKS_KEY, JSON.stringify(_cache.customTasks));}catch(e){}
  if(_cache.activities) try{localStorage.setItem(ACT_KEY, JSON.stringify(_cache.activities));}catch(e){}
  if(_cache.phrases) try{localStorage.setItem(PHRASES_KEY, JSON.stringify(_cache.phrases));}catch(e){}
  renderNotes();
  renderHomePending();
  renderDaySummary();
  renderPhrases();
}

async function fbSaveNotes(notes) {
  try{localStorage.setItem(NOTES_KEY, JSON.stringify(notes));}catch(e){}
  if(window._fbReady) window._fbSave({notes});
}
async function fbSaveTaskState(state) {
  try{localStorage.setItem(TASK_STATE_KEY, JSON.stringify(state));}catch(e){}
  if(window._fbReady) window._fbSave({taskState: state});
}
async function fbSaveCustomTasks(tasks) {
  try{localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));}catch(e){}
  if(window._fbReady) window._fbSave({customTasks: tasks});
}
async function fbSaveActivity(idx, text) {
  let all = {};
  try{all = JSON.parse(localStorage.getItem(ACT_KEY)||'{}');}catch(e){}
  all[idx] = text;
  try{localStorage.setItem(ACT_KEY, JSON.stringify(all));}catch(e){}
  if(window._fbReady) window._fbSave({activities: all});
}
async function fbSavePhrases(phrases) {
  try{localStorage.setItem(PHRASES_KEY, JSON.stringify(phrases));}catch(e){}
  if(window._fbReady) window._fbSave({phrases});
}

// Listen for real-time changes from other devices
document.addEventListener('fb-ready', () => {
  fbInit();
  window._fbListen((data) => {
    _cache = data;
    if(data.notes) try{localStorage.setItem(NOTES_KEY, JSON.stringify(data.notes));}catch(e){}
    if(data.taskState) try{localStorage.setItem(TASK_STATE_KEY, JSON.stringify(data.taskState));}catch(e){}
    if(data.customTasks) try{localStorage.setItem(TASKS_KEY, JSON.stringify(data.customTasks));}catch(e){}
    if(data.activities) try{localStorage.setItem(ACT_KEY, JSON.stringify(data.activities));}catch(e){}
    if(data.phrases) try{localStorage.setItem(PHRASES_KEY, JSON.stringify(data.phrases));}catch(e){}
    renderNotes();
    renderHomePending();
    renderDaySummary();
    renderPhrases();
  });
});
function loadActivity(idx){
  try{
    const all=JSON.parse(localStorage.getItem(ACT_KEY)||'{}');
    return all[idx]!==undefined?all[idx]:null;
  }catch(e){return null;}
}
function saveActivity(idx,text){fbSaveActivity(idx,text);}

function startEditActivity(idx){
  if(readOnly){showReadOnlyMsg();return;}
  const card=document.getElementById(`activity-card-${idx}`);
  const d=days[idx];
  const customAct=loadActivity(idx);
  const current=customAct!==null?customAct:d.activity;
  card.innerHTML=`
    <textarea class="activity-textarea" id="activity-edit-area-${idx}" rows="6">${current}</textarea>
    <div class="activity-edit-actions">
      <button class="activity-save-btn" onclick="saveActivityEdit(${idx})">Guardar</button>
      <button class="activity-cancel-btn" onclick="cancelActivityEdit(${idx})">Cancelar</button>
    </div>`;
  const ta=document.getElementById(`activity-edit-area-${idx}`);
  ta.focus();
  ta.setSelectionRange(ta.value.length,ta.value.length);
}

function saveActivityEdit(idx){
  const ta=document.getElementById(`activity-edit-area-${idx}`);
  if(!ta)return;
  const newText=ta.value.trim();
  saveActivity(idx,newText);
  const card=document.getElementById(`activity-card-${idx}`);
  card.innerHTML=`<div class="activity-text" id="activity-text-${idx}">${newText.replace(/\n/g,'<br>')}</div>`;
}

function cancelActivityEdit(idx){
  const d=days[idx];
  const customAct=loadActivity(idx);
  const current=customAct!==null?customAct:d.activity;
  const card=document.getElementById(`activity-card-${idx}`);
  card.innerHTML=`<div class="activity-text" id="activity-text-${idx}">${current.replace(/\n/g,'<br>')}</div>`;
}

const NOTES_KEY='j26_notes';
let currentTags=[];
function loadNotes(){try{return JSON.parse(localStorage.getItem(NOTES_KEY)||'[]');}catch(e){return[];}}
function saveNotesData(n){fbSaveNotes(n);}

function populateDaySelect(){
  const sel=document.getElementById('note-day-select');
  sel.innerHTML='<option value="">— Nota general —</option>';
  days.forEach(d=>{
    const o=document.createElement('option');
    o.value=d.date;
    o.textContent=`${d.num} ${d.month} · ${d.city.split('→')[0].trim()}`;
    sel.appendChild(o);
  });
}
populateDaySelect();

const tagInput=document.getElementById('tag-input');
tagInput.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&tagInput.value.trim()){e.preventDefault();addTag(tagInput.value.trim().replace(/^#/,''));tagInput.value='';}
  if(e.key==='Backspace'&&!tagInput.value&&currentTags.length>0){currentTags.pop();renderCurrentTags();}
});
function addTag(t){if(t&&!currentTags.includes(t)){currentTags.push(t);renderCurrentTags();}}
function removeTag(t){currentTags=currentTags.filter(x=>x!==t);renderCurrentTags();}
function renderCurrentTags(){
  document.getElementById('current-tags-display').innerHTML=currentTags.map(t=>`<span class="tag-pill">#${t}<button onclick="removeTag('${t}')">×</button></span>`).join('');
}
function saveNote(){
  if(readOnly){showReadOnlyMsg();return;}
  const text=document.getElementById('note-textarea').value.trim();
  if(!text)return;
  const sel=document.getElementById('note-day-select');
  const date=sel.value;
  const dayLabel=sel.options[sel.selectedIndex]?.text||'Nota general';
  const now=new Date();
  const savedAt=now.toLocaleDateString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const notes=loadNotes();
  notes.push({text,dayLabel,date,savedAt,tags:[...currentTags]});
  saveNotesData(notes);
  document.getElementById('note-textarea').value='';
  currentTags=[];
  renderCurrentTags();
  renderNotes();
  const dot=document.getElementById('sync-dot'),lbl=document.getElementById('sync-label');
  dot.style.background='#F39C12';lbl.textContent='Sincronizando...';
  setTimeout(()=>{dot.style.background='#2E7D56';lbl.textContent='Sincronizado ☁️';},1200);
}
function deleteNote(i){if(readOnly){showReadOnlyMsg();return;}const n=loadNotes();n.splice(i,1);saveNotesData(n);renderNotes();}
function renderNotes(){
  const notes=loadNotes();
  const list=document.getElementById('notes-list');
  if(notes.length===0){list.innerHTML=`<div class="empty-notes"><div class="emoji">📝</div><p>Todavía no hay notas.<br>¡Escribe la primera cuando lleguéis!</p></div>`;return;}
  list.innerHTML=notes.slice().reverse().map((n,ri)=>{
    const i=notes.length-1-ri;
    const tags=n.tags&&n.tags.length>0?`<div class="note-tags-display">${n.tags.map(t=>`<span class="note-tag-chip">#${t}</span>`).join('')}</div>`:'';
    return `<div class="note-card">
      <div class="note-card-header">
        <span class="note-day-label">${n.dayLabel||'General'}</span>
        <div style="display:flex;align-items:center;gap:8px"><span class="note-date-label">${n.savedAt||''}</span><button class="note-delete" onclick="deleteNote(${i})">×</button></div>
      </div>
      <div class="note-text">${n.text.replace(/\n/g,'<br>')}</div>${tags}
    </div>`;
  }).join('');
}

function loadCustomPhrases(){try{return JSON.parse(localStorage.getItem(PHRASES_KEY)||'[]');}catch(e){return[];}}
function saveCustomPhrases(p){fbSavePhrases(p);}

function renderPhrases(){
  const custom=loadCustomPhrases();
  const allCats=[...defaultPhrases];
  if(custom.length>0)allCats.push({cat:'⭐ Mis frases',phrases:custom});
  let html='';
  allCats.forEach(cat=>{
    html+=`<div class="phrase-group"><div class="section-title">${cat.cat}</div><div class="phrase-list">`;
    cat.phrases.forEach(p=>{
      const cls=p.interactive?'phrase-card interactive':'phrase-card';
      const pData=encodeURIComponent(JSON.stringify(p));
      html+=`<div class="${cls}" onclick="openPhrase('${pData}')">
        <div>
          <div class="phrase-es">${p.es}</div>
          <div class="phrase-preview">${p.jp.substring(0,18)}${p.jp.length>18?'…':''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:5px">
          ${p.interactive?'<span style="font-size:10px;color:var(--blue);font-weight:600">✏️</span>':''}
          <div class="phrase-arrow">›</div>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  html+=`<button class="add-phrase-btn" onclick="openAddPhraseModal()"><span style="font-size:20px">+</span> Añadir frase</button>`;
  document.getElementById('phrases-body').innerHTML=html;
}
renderPhrases();

let currentPhrase=null;
function openPhrase(pData){
  currentPhrase=JSON.parse(decodeURIComponent(pData));
  const p=currentPhrase;
  const modal=document.getElementById('phrase-modal');
  modal.classList.remove('hidden');
  document.getElementById('pm-label').textContent=p.interactive?'Escribe el lugar:':'Muestra esto:';
  document.getElementById('pm-es').textContent=p.es;
  if(p.interactive){
    document.getElementById('pm-interactive-area').innerHTML=`<input class="phrase-interactive-input" id="interactive-fill" placeholder="${p.placeholder||'Escribe aquí...'}" oninput="updateInteractive()"/>`;
    document.getElementById('pm-jp').textContent=p.jp.replace('___','___');
    document.getElementById('pm-romaji').textContent=p.ro.replace('___','___');
  }else{
    document.getElementById('pm-interactive-area').innerHTML='';
    document.getElementById('pm-jp').textContent=p.jp;
    document.getElementById('pm-romaji').textContent=p.ro;
  }
}
function updateInteractive(){
  const val=document.getElementById('interactive-fill')?.value||'';
  const p=currentPhrase;if(!p)return;
  document.getElementById('pm-jp').textContent=p.jp.replace('___',val||'___');
  document.getElementById('pm-romaji').textContent=p.ro.replace('___',val||'___');
}
function closePhraseModal(){document.getElementById('phrase-modal').classList.add('hidden');}
function openAddPhraseModal(){if(readOnly){showReadOnlyMsg();return;}document.getElementById('add-phrase-modal').classList.remove('hidden');}
function closeAddPhraseModal(){document.getElementById('add-phrase-modal').classList.add('hidden');['af-es','af-jp','af-ro'].forEach(id=>document.getElementById(id).value='');}
function saveCustomPhrase(){
  if(readOnly){showReadOnlyMsg();return;}
  const es=document.getElementById('af-es').value.trim();
  const jp=document.getElementById('af-jp').value.trim();
  const ro=document.getElementById('af-ro').value.trim();
  if(!es||!jp)return;
  const custom=loadCustomPhrases();
  custom.push({es,jp,ro});
  saveCustomPhrases(custom);
  closeAddPhraseModal();
  renderPhrases();
}

// ═══ NAVIGATION ═══
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(name+'-screen').classList.add('active');
  const btn=document.getElementById('nav-'+name);
  if(btn)btn.classList.add('active');
  window.scrollTo(0,0);
}
